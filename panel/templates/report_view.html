<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TESL-Panel — {{ filename }}</title>
  <style>
    :root { color-scheme: dark; --bg: #0f1115; --card: #171a21; --card-border: #262b36;
      --text: #e7e9ee; --muted: #9aa3b2; --accent: #5b8def; --warn: #e0a72e; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; padding: 32px 16px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 1.1rem; margin: 0 0 16px; width: 100%; max-width: 1000px; word-break: break-all; }
    .toolbar { width: 100%; max-width: 1000px; display: flex; align-items: center;
      gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 8px 14px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    .btn:hover { text-decoration: none; opacity: 0.9; }
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
      padding: 0; width: 100%; max-width: 1000px; overflow: hidden; }
    pre { margin: 0; padding: 18px; max-height: 72vh; overflow: auto;
      font-family: "Consolas", "SFMono-Regular", Menlo, monospace; font-size: 0.85rem;
      line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .warn-box { padding: 18px; color: var(--warn); }
  </style>
</head>
<body>
  <h1>
    <a href="/admin/reports/{{ report_type }}/{{ username }}/{{ timestamp }}">&larr; {{ title }} / {{ username }} / {{ timestamp }}</a>
    / {{ filename }}
  </h1>

  <div class="toolbar">
    <span class="muted">{{ (size / 1024) | round(1) }} КБ</span>
    <a class="btn" href="/admin/reports/{{ report_type }}/{{ username }}/{{ timestamp }}/{{ filename }}">⬇ Скачать</a>
  </div>

  <div class="card">
    {% if error %}
      <div class="warn-box">⚠️ {{ error }}</div>
    {% else %}
      <pre>{{ text }}</pre>
    {% endif %}
  </div>
</body>
</html>
