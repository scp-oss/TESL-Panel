<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TESL-Panel — {{ username }}</title>
  <style>
    :root { color-scheme: dark; --bg: #0f1115; --card: #171a21; --card-border: #262b36;
      --text: #e7e9ee; --muted: #9aa3b2; --accent: #5b8def; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; padding: 48px 16px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 1.3rem; margin: 0 0 20px; width: 100%; max-width: 480px; }
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
      padding: 20px; width: 100%; max-width: 480px; }
    ul { margin: 0; padding-left: 0; list-style: none; }
    li { padding: 8px 0; border-bottom: 1px solid var(--card-border); }
    li:last-child { border-bottom: none; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <h1>
    <a href="/admin/reports/{{ report_type }}">&larr; {{ title }}</a> / <code>{{ username }}</code>
  </h1>
  <div class="card">
    {% if timestamps %}
      <ul>
        {% for ts in timestamps %}
          <li><a href="/admin/reports/{{ report_type }}/{{ username }}/{{ ts }}">{{ ts }}</a></li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="muted">Пусто.</p>
    {% endif %}
  </div>
</body>
</html>
