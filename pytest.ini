[pytest]
; Живой баг 2026-09-29: голая команда `pytest` (в отличие от
; `python3 -m pytest`) не добавляет текущую рабочую директорию в
; sys.path сама — `from panel.app import create_app` в
; tests/integration/conftest.py падал с ModuleNotFoundError('panel')
; именно поэтому, воспроизведено и подтверждено на реальном сервере.
; `pythonpath` — встроенная опция pytest (с 7.0, без стороннего плагина)
; ровно под этот случай — делает поведение одинаковым независимо от
; того, как запущен pytest.
pythonpath = .
